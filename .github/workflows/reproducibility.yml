name: Reproducibility checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.16'

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt scipy==1.13.1

      - name: Check Python entry points
        run: |
          python -m compileall -q benchmark_st1_st2.py stress_test
          python stress_test/run_selective_validation.py --help

      - name: Verify archived benchmark and result provenance
        run: |
          python benchmark_st1_st2.py --verify-existing
          frozen_dir=$(mktemp -d)
          python -m zipfile -e reproducibility.zip "$frozen_dir"
          cmp benchmark_st1_st2.py "$frozen_dir/benchmark_st1_st2.py"
          cmp benchmark_st1_st2_results.json "$frozen_dir/benchmark_st1_st2_results.json"
          python "$frozen_dir/benchmark_st1_st2.py" --verify-existing
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          inputs = {
              "frozen_benchmark_sha256": Path("benchmark_st1_st2.py"),
              "frozen_results_sha256": Path("benchmark_st1_st2_results.json"),
          }
          hashes = {key: hashlib.sha256(path.read_bytes()).hexdigest() for key, path in inputs.items()}
          nominal = json.loads(inputs["frozen_results_sha256"].read_bytes())["thresholds"]
          for name in ("stress_test_results.json", "selective_validation_results.json"):
              path = Path("stress_test") / name
              result = json.loads(path.read_bytes())
              for key, value in hashes.items():
                  if result[key] != value:
                      raise SystemExit(f"{path}: {key} does not match the frozen benchmark")
              if name == "selective_validation_results.json":
                  expected = {key: nominal[key] for key in ("nonnull_99", "st1_95", "st2_95")}
                  if result["thresholds"] != expected:
                      raise SystemExit(f"{path}: thresholds do not match the frozen benchmark")
          PY

      - name: Render English figures from the archived results
        run: |
          mkdir -p main/figs supplement/figs
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          from stress_test.render_revision_figures import diagnostics, kernel_schematics, schematic

          main_figs = Path("main/figs")
          with ZipFile("reproducibility.zip") as archive:
              frozen = json.loads(archive.read("benchmark_st1_st2_results.json"))
          kernel_schematics(main_figs, Path("supplement/figs"))
          schematic(main_figs / "kturn_drift_test.pdf", it=False)
          diagnostics(frozen, main_figs / "st1_st2_operating_diagnostics.pdf", it=False)
          PY
          test "$(find main/figs supplement/figs -type f -name '*.pdf' -size +0c | wc -l)" -eq 5
